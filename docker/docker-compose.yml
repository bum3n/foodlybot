version: "3.9"

services:
  nutribot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: telegram_nutribot
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      # Persistent storage for SQLite database and uploaded food photos
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
